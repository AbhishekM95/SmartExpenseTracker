<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Budget - Smart Expense Tracker</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

<div class="container">

```
<h1>🎯 Set Budget</h1>

<p>Set your spending budget below.</p>


<form id="budgetForm">

    <!-- Budget Amount -->

    <label for="amount">
        <strong>Budget Amount:</strong>
    </label>

    <br>

    <input
        type="number"
        id="amount"
        placeholder="Enter budget amount"
        min="0.01"
        step="0.01"
        required
    >

    <br><br>


    <!-- Category -->

    <label for="category">
        <strong>Category:</strong>
    </label>

    <br>

    <select id="category" required>

        <option value="">
            Select Category
        </option>

        <option value="1">Food</option>
        <option value="2">Shopping</option>
        <option value="3">Transport</option>
        <option value="4">Education</option>
        <option value="5">Health</option>
        <option value="6">Entertainment</option>
        <option value="7">Other</option>

    </select>

    <br><br>


    <!-- Start Date -->

    <label for="startDate">
        <strong>Start Date:</strong>
    </label>

    <br>

    <input
        type="date"
        id="startDate"
        required
    >

    <br><br>


    <!-- End Date -->

    <label for="endDate">
        <strong>End Date:</strong>
    </label>

    <br>

    <input
        type="date"
        id="endDate"
        required
    >

    <br><br>


    <!-- Submit -->

    <button type="submit">
        💾 Set Budget
    </button>

</form>


<p id="message"></p>


<br>


<a href="dashboard.html">

    <button type="button">
        ← Back to Dashboard
    </button>

</a>
```

</div>

<script>

    // ==============================
    // CHECK LOGIN
    // ==============================

    const loggedInUser =
        localStorage.getItem("userId");


    if (!loggedInUser) {

        alert("Please login first.");

        window.location.href =
            "login.html";

    }


    // ==============================
    // BUDGET FORM
    // ==============================

    const budgetForm =
        document.getElementById("budgetForm");


    const startDateInput =
        document.getElementById("startDate");


    const endDateInput =
        document.getElementById("endDate");


    /*
     * When Start Date changes,
     * End Date cannot be before it.
     */

    startDateInput.addEventListener(
        "change",
        function() {

            endDateInput.min =
                startDateInput.value;

        }
    );


    budgetForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
             * Get logged-in user's ID
             */

            const userId =
                localStorage.getItem("userId");


            /*
             * Get form values
             */

            const amount =
                document.getElementById("amount").value;


            const categoryId =
                document.getElementById("category").value;


            const startDate =
                startDateInput.value;


            const endDate =
                endDateInput.value;


            const message =
                document.getElementById("message");


            /*
             * Check login
             */

            if (!userId) {

                message.innerText =
                    "Please login first.";

                return;

            }


            /*
             * Validate amount
             */

            if (Number(amount) <= 0) {

                message.innerText =
                    "Budget amount must be greater than ₹0.";

                return;

            }


            /*
             * Validate category
             */

            if (!categoryId) {

                message.innerText =
                    "Please select a category.";

                return;

            }


            /*
             * Validate dates
             */

            if (!startDate || !endDate) {

                message.innerText =
                    "Please select both start and end dates.";

                return;

            }


            /*
             * End date cannot be
             * before start date
             */

            if (endDate < startDate) {

                message.innerText =
                    "End date cannot be before start date.";

                return;

            }


            /*
             * Prepare data
             */

            const data =
                "userId=" +
                encodeURIComponent(userId) +

                "&categoryId=" +
                encodeURIComponent(categoryId) +

                "&amount=" +
                encodeURIComponent(amount) +

                "&startDate=" +
                encodeURIComponent(startDate) +

                "&endDate=" +
                encodeURIComponent(endDate);


            try {

                const response =
                    await fetch(
                        "https://smartexpensetracker-backend-a2xz.onrender.com/budget",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: data
                        }
                    );


                const result =
                    await response.text();


                message.innerText =
                    result;


                /*
                 * Clear form after
                 * successful submission
                 */

                if (response.ok) {

                    budgetForm.reset();

                    endDateInput.min = "";

                }


            } catch (error) {

                console.error(error);

                message.innerText =
                    "Cannot connect to Java server.";

            }

        }
    );

</script>

</body>

</html>
