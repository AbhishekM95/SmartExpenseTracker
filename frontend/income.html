<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Income - Smart Expense Tracker</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<div class="container">

    <h1>📈 Add Income</h1>

    <p>Enter your income details below.</p>


    <form id="incomeForm">

        <!-- Income Amount -->

        <label for="amount">
            <strong>Amount:</strong>
        </label>

        <br>

        <input
            type="number"
            id="amount"
            placeholder="Enter income amount"
            min="0.01"
            step="0.01"
            required
        >

        <br><br>


        <!-- Income Source -->

        <label for="category">
            <strong>Income Source:</strong>
        </label>

        <br>

        <select id="category" required>

            <option value="">
                Select Source
            </option>

            <option value="8">Salary</option>
            <option value="9">Freelancing</option>
            <option value="10">Business</option>
            <option value="11">Investment</option>
            <option value="12">Other</option>

        </select>

        <br><br>


        <!-- Income Date -->

        <label for="incomeDate">
            <strong>Date:</strong>
        </label>

        <br>

        <input
            type="date"
            id="incomeDate"
            required
        >

        <br><br>


        <!-- Description -->

        <label for="description">
            <strong>Description:</strong>
        </label>

        <br>

        <textarea
            id="description"
            placeholder="Enter income description"
            rows="4"
            cols="30"
            maxlength="255"></textarea>

        <br>

        <small>
            Maximum 255 characters
        </small>

        <br><br>


        <!-- Submit -->

        <button type="submit">
            💾 Add Income
        </button>

    </form>


    <p id="message"></p>


    <br>


    <a href="dashboard.html">
        <button type="button">
            ← Back to Dashboard
        </button>
    </a>

</div>


<script>

    // ==============================
    // CHECK LOGIN
    // ==============================

    const loggedInUser =
        localStorage.getItem("userId");


    if (!loggedInUser) {

        alert("Please login first.");

        window.location.href =
            "login.html";

    }


    // ==============================
    // INCOME FORM
    // ==============================

    const incomeForm =
        document.getElementById("incomeForm");


    /*
     * Prevent selecting a future date
     */

    const today =
        new Date().toISOString().split("T")[0];


    document.getElementById("incomeDate").max =
        today;


    incomeForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
             * Get logged-in user's ID
             */

            const userId =
                localStorage.getItem("userId");


            /*
             * Get form values
             */

            const amount =
                document.getElementById("amount").value;


            const categoryId =
                document.getElementById("category").value;


            const incomeDate =
                document.getElementById("incomeDate").value;


            const description =
                document.getElementById("description")
                    .value
                    .trim();


            const message =
                document.getElementById("message");


            /*
             * Check login
             */

            if (!userId) {

                message.innerText =
                    "Please login first.";

                return;

            }


            /*
             * Validate amount
             */

            if (Number(amount) <= 0) {

                message.innerText =
                    "Amount must be greater than ₹0.";

                return;

            }


            /*
             * Validate income source
             */

            if (!categoryId) {

                message.innerText =
                    "Please select an income source.";

                return;

            }


            /*
             * Validate date
             */

            if (!incomeDate) {

                message.innerText =
                    "Please select a date.";

                return;

            }


            if (incomeDate > today) {

                message.innerText =
                    "Future dates are not allowed.";

                return;

            }


            /*
             * Prepare data
             */

            const data =
                "userId=" +
                encodeURIComponent(userId) +

                "&categoryId=" +
                encodeURIComponent(categoryId) +

                "&amount=" +
                encodeURIComponent(amount) +

                "&incomeDate=" +
                encodeURIComponent(incomeDate) +

                "&description=" +
                encodeURIComponent(description);


            try {

                const response =
                    await fetch(
                        "http://localhost:8081/income",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: data
                        }
                    );


                const result =
                    await response.text();


                message.innerText =
                    result;


                /*
                 * Clear form after
                 * successful submission
                 */

                if (response.ok) {

                    incomeForm.reset();

                }


            } catch (error) {

                console.error(error);

                message.innerText =
                    "Cannot connect to Java server.";

            }

        }
    );

</script>
```

</body>

</html>
