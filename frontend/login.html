<!DOCTYPE html>

<html>

<head>

<title>Login - Smart Personal Expense Tracker</title>

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<h1>Login</h1>


<form id="loginForm">

    <label>Email:</label>

    <br>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <br><br>


    <label>Password:</label>

    <br>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <br><br>


    <button type="submit">
        Login
    </button>

</form>


<p id="message"></p>


<p>
    Don't have an account?
</p>

<a href="register.html">
    Create Account
</a>


<br><br>


<a href="index.html">
    Back to Home
</a>


<script>

// =====================================
// LOGIN
// =====================================

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // Get email and password

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        // Prepare data

        const data =
            "email=" +
            encodeURIComponent(email) +
            "&password=" +
            encodeURIComponent(password);


        try {


            // Send login request

            const response =
                await fetch(
                    "https://smartexpensetracker-6oc9.onrender.com/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: data
                    }
                );


            // Get server response

            const result =
                await response.text();


            console.log(
                "Server response:",
                result
            );


            // =================================
            // LOGIN SUCCESS
            // =================================

            if (
                result.startsWith(
                    "Login successful!"
                )
            ) {


                // Get user ID

                const userId =
                    result.split("|")[1];


                console.log(
                    "User ID:",
                    userId
                );


                // Save user information

                localStorage.setItem(
                    "userId",
                    userId
                );


                localStorage.setItem(
                    "userEmail",
                    email
                );


                // User name is not returned
                // by the current login server.

                if (
                    !localStorage.getItem(
                        "userName"
                    )
                ) {

                    localStorage.setItem(
                        "userName",
                        "User"
                    );

                }


                // Go to dashboard

                window.location.href =
                    "dashboard.html";


            } else {


                // Login failed

                document.getElementById(
                    "message"
                ).innerText =
                    result;

            }


        } catch (error) {


            console.error(error);


            document.getElementById(
                "message"
            ).innerText =
                "Cannot connect to Java server.";

        }

    }
);

</script>


</body>

</html>
