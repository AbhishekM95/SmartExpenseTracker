</div>

<script>


// ==============================
// CHECK LOGIN
// ==============================

if (!localStorage.getItem("userId")) {

    alert("Please login first.");

    window.location.href =
        "login.html";

}


// ==============================
// DISPLAY USER NAME
// ==============================

const storedUserName =
    localStorage.getItem("userName");


if (storedUserName) {

    document.getElementById(
        "dashboardUserName"
    ).innerText =
        storedUserName;

}


// ==============================
// LOAD DASHBOARD SUMMARY
// ==============================

async function loadDashboard() {


    const userId =
        localStorage.getItem("userId");


    if (!userId) {

        return;

    }


    const data =
        "userId=" +
        encodeURIComponent(userId);


    try {


        const response =
            await fetch(
                "http://localhost:8081/dashboard",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: data
                }
            );


        const result =
            await response.text();


        console.log(
            "Dashboard response:",
            result
        );


        const values =
            new URLSearchParams(result);


        // Get income

        const income =
            parseFloat(
                values.get("income")
            ) || 0;


        // Get expense

        const expense =
            parseFloat(
                values.get("expense")
            ) || 0;


        // Get budget

        const budget =
            parseFloat(
                values.get("budget")
            ) || 0;


        // Get balance

        const balance =
            parseFloat(
                values.get("balance")
            ) || 0;


        // Display income

        document.getElementById(
            "income"
        ).innerText =
            "₹" +
            income.toFixed(2);


        // Display expense

        document.getElementById(
            "expense"
        ).innerText =
            "₹" +
            expense.toFixed(2);


        // Display budget

        document.getElementById(
            "budget"
        ).innerText =
            "₹" +
            budget.toFixed(2);


        // Display balance

        document.getElementById(
            "balance"
        ).innerText =
            "₹" +
            balance.toFixed(2);


        // Calculate remaining budget

        const remainingBudget =
            budget - expense;


        // Display amount spent

        document.getElementById(
            "budgetSpent"
        ).innerText =
            "₹" +
            expense.toFixed(2);


        // Display remaining budget

        document.getElementById(
            "remainingBudget"
        ).innerText =
            "₹" +
            remainingBudget.toFixed(2);


    } catch (error) {


        console.error(error);


        document.getElementById(
            "transactions"
        ).innerText =
            "Cannot connect to Java server.";

    }

}


// ==============================
// LOGOUT
// ==============================

function logout() {


    localStorage.removeItem(
        "userId"
    );


    localStorage.removeItem(
        "userName"
    );


    localStorage.removeItem(
        "userEmail"
    );


    window.location.href =
        "login.html";

}


// ==============================
// LOAD RECENT TRANSACTIONS
// ==============================

async function loadTransactions() {


    const userId =
        localStorage.getItem("userId");


    if (!userId) {

        return;

    }


    const data =
        "userId=" +
        encodeURIComponent(userId);


    try {


        const response =
            await fetch(
                "http://localhost:8081/transactions",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: data
                }
            );


        const result =
            await response.text();


        console.log(
            "Transactions response:",
            result
        );


        const transactionsDiv =
            document.getElementById(
                "transactions"
            );


        transactionsDiv.innerHTML =
            "";


        // Check if there are no transactions

        if (result.trim() === "") {


            transactionsDiv.innerText =
                "No transactions found.";


            return;

        }


        // Separate transactions

        const rows =
            result.trim().split("\n");


        // Process transactions

        rows.forEach(function(row) {


            const parts =
                row.split("|");


            const type =
                parts[0];


            const category =
                parts[1];


            const amount =
                parseFloat(parts[2]) || 0;


            const date =
                parts[3];


            const description =
                parts.slice(4).join("|");


            // Create transaction element

            const transaction =
                document.createElement("div");


            transaction.className =
                "transaction-item";


            // Display income

            if (type === "INCOME") {


                transaction.innerText =
                    category +
                    " + ₹" +
                    amount.toFixed(2) +
                    " (" +
                    date +
                    ")" +
                    (
                        description
                            ? " - " + description
                            : ""
                    );


            }


            // Display expense

            else {


                transaction.innerText =
                    category +
                    " - ₹" +
                    amount.toFixed(2) +
                    " (" +
                    date +
                    ")" +
                    (
                        description
                            ? " - " + description
                            : ""
                    );

            }


            // Add transaction

            transactionsDiv.appendChild(
                transaction
            );


        });


    } catch (error) {


        console.error(error);


        document.getElementById(
            "transactions"
        ).innerText =
            "Cannot load transactions.";

    }

}


// ==============================
// START DASHBOARD
// ==============================

if (
    localStorage.getItem("userId")
) {


    loadDashboard();


    loadTransactions();


}

</script>
